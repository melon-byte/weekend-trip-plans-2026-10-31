      '14':'口碑最稳，白天有东西吃逛。',
      '15':'花海很出片，晴天更值。',
      '16':'模型和步道轻松，收费项目先问。',
      '17':'老街加商圈，顺路感强。'
    };
    const ordered=routes.slice().sort((a,b)=>routeRatings[b.n].total-routeRatings[a.n].total);
    let selectedRoute=ordered[0].n,activeTab='routes',departure='morning',area='all',category='all',sortBy='score',onlyFavorites=false;
    let favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem('weekend-favorite-routes')||'[]').filter(n=>routes.some(r=>r.n===n)));}catch{}
    const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function photo(p){return '<button class="photo-button" type="button" data-photo="'+esc(p.src)+'" data-caption="'+esc(p.caption+' · '+p.credit+' · '+p.date)+'" data-source="'+esc(p.source)+'"><img src="'+esc(p.src)+'" alt="'+esc(p.caption)+'" loading="lazy" referrerpolicy="no-referrer"></button>';}
    function saveFavorites(){try{localStorage.setItem('weekend-favorite-routes',JSON.stringify([...favorites]));}catch{}document.getElementById('favoriteCount').textContent=favorites.size;}
    function toggleFavorite(n){favorites.has(n)?favorites.delete(n):favorites.add(n);saveFavorites();renderBoard();if(document.getElementById('routeModal').open){const b=document.querySelector('.jump-favorite');b.textContent=favorites.has(n)?'★ 已收藏':'☆ 收藏这条';b.setAttribute('aria-pressed',String(favorites.has(n)));}}
    function renderBoard(){const selected=ordered.filter(r=>(area==='all'||r.area.includes(area))&&(category==='all'||r.play.category===category)&&(!onlyFavorites||favorites.has(r.n)));if(sortBy==='rain')selected.sort((a,b)=>Number(b.play.rain)-Number(a.play.rain)||routeRatings[b.n].total-routeRatings[a.n].total);if(sortBy==='easy')selected.sort((a,b)=>Number(b.play.walk==='少')-Number(a.play.walk==='少')||routeRatings[b.n].total-routeRatings[a.n].total);document.getElementById('boardCount').textContent=selected.length+'条路线';document.getElementById('routeBoard').innerHTML=selected.length?selected.map(r=>{const n=r.n,s=routeRatings[n],p=reviewData[n].photos[0];return '<article class="rank-row" data-row="'+n+'"><button class="row-open" type="button" data-route="'+n+'" aria-haspopup="dialog"><span class="row-rank">'+String(s.rank).padStart(2,'0')+'</span><img class="row-photo" src="'+esc(p.src)+'" alt="'+esc(p.caption)+'" loading="lazy" referrerpolicy="no-referrer"><span class="row-main"><strong>'+esc(r.title)+'</strong><span class="row-review">口碑：'+esc(reviewLines[n])+'</span></span></button><button class="favorite" type="button" data-favorite="'+n+'" aria-pressed="'+favorites.has(n)+'" aria-label="'+(favorites.has(n)?'取消收藏':'收藏')+esc(r.title)+'">'+(favorites.has(n)?'★':'☆')+'</button></article>';}).join(''):'<p class="list-empty">当前没有匹配项。试试其他片区或关闭“只看收藏”。</p>';saveFavorites();}
    function short(s){if(s.includes('早餐'))return '早餐';if(s.includes('午饭'))return '午饭';if(s.includes('晚饭'))return '晚饭';return s;}
    function row(s){return '<div class="time-row"><time>'+esc(s[0])+'</time><p>'+esc(short(s[1]))+'</p></div>';}
    function lodgingHtml(n){const h=reviewData[n].hotel,pictures=reviewData[n].photos.filter(p=>p.source.includes('/hotels/')).slice(-2);return '<section class="modal-section stay-inline" id="modal-stay"><h4>住宿 · '+esc(h.name)+'</h4><p>'+esc(h.rooms)+'</p><div class="compact-gallery">'+pictures.map(p=>'<figure>'+photo(p)+'<figcaption>'+esc(p.caption)+'</figcaption></figure>').join('')+'</div><a class="action" href="'+esc(h.url)+'" target="_blank" rel="noopener">看房源 ↗</a> <button class="action" type="button" data-switch="stays">看全部住宿</button></section>';}
    function renderModal(){const r=routes.find(r=>r.n===selectedRoute),n=r.n,d=reviewData[n],sat=departure==='noon'?r.noonSat:r.sat;document.getElementById('routeDetail').innerHTML='<section id="modal-play" class="modal-section"><div class="detail-top"><div><h2 id="routeModalTitle">'+esc(r.title)+'</h2><p class="detail-sub">'+esc(r.subtitle)+'</p><p class="detail-review">口碑：'+esc(reviewLines[n])+'</p></div><button type="button" class="jump-favorite" data-favorite="'+n+'" aria-pressed="'+favorites.has(n)+'">'+(favorites.has(n)?'★ 已收藏':'☆ 收藏')+'</button></div><div class="compact-gallery">'+d.photos.slice(0,3).map(p=>'<figure>'+photo(p)+'<figcaption>'+esc(p.caption)+'</figcaption></figure>').join('')+'</div><div class="activity-cards">'+r.play.primary.map(x=>'<article class="activity-card"><b>'+esc(x)+'</b></article>').join('')+'</div></section><section class="modal-section" id="modal-time"><h3 class="review-heading">两天安排</h3><div class="timeline-switch"><span>周六出发</span><button class="choice" type="button" data-departure="morning" aria-pressed="'+(departure==='morning')+'">上午</button><button class="choice" type="button" data-departure="noon" aria-pressed="'+(departure==='noon')+'">中午</button></div><div class="days"><section class="day"><h3>周六 · 10月31日</h3>'+sat.map(row).join('')+'</section><section class="day"><h3>周日 · 11月1日</h3>'+r.sun.map(row).join('')+'</section></div></section>'+lodgingHtml(n);}
    function showRoute(n){if(!routes.some(r=>r.n===n))return;selectedRoute=n;departure='morning';renderModal();const d=document.getElementById('routeModal');if(!d.open)d.showModal();d.scrollTop=0;document.documentElement.style.overflow='hidden';}
    function closeRoute(){const d=document.getElementById('routeModal');if(d.open)d.close();document.documentElement.style.overflow='';}
    function switchTab(name,update=true){if(!['routes','stays'].includes(name))name='routes';closeRoute();activeTab=name;document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===name;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});document.querySelectorAll('[role=tabpanel]').forEach(p=>p.hidden=p.id!=='panel-'+name);if(update)history.replaceState(null,'','#'+name);}
    function renderStays(){document.getElementById('stayCards').innerHTML=villaCandidates.map(v=>'<article class="stay"><span class="pill">'+esc(v.type)+'</span><h3>'+esc(v.name)+'</h3><p>'+esc(v.bedrooms)+'</p><div class="compact-gallery">'+v.photos.slice(0,2).map(p=>'<figure>'+photo(p)+'<figcaption>'+esc(p.caption)+'</figcaption></figure>').join('')+'</div><a class="action" href="'+esc(v.source)+'" target="_blank" rel="noopener">看房源 ↗</a><button class="action" data-route="'+v.route+'" type="button">看路线</button></article>').join('');}
    function handleHash(){const h=location.hash.slice(1),m=/^route-([0-9]{2})$/.exec(h);if(m){switchTab('routes',false);showRoute(m[1]);return;}switchTab(h==='stays'?'stays':'routes',false);}
    document.addEventListener('click',e=>{const fav=e.target.closest('[data-favorite]');if(fav){toggleFavorite(fav.dataset.favorite);return;}const cat=e.target.closest('[data-category]');if(cat){category=cat.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>{const yes=b===cat;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes));});renderBoard();return;}const t=e.target.closest('[data-tab]');if(t){switchTab(t.dataset.tab);return;}const r=e.target.closest('[data-route]');if(r){showRoute(r.dataset.route);return;}const sw=e.target.closest('[data-switch]');if(sw){switchTab(sw.dataset.switch);return;}const dp=e.target.closest('[data-departure]');if(dp){departure=dp.dataset.departure;const y=document.getElementById('routeModal').scrollTop;renderModal();document.getElementById('routeModal').scrollTop=y;return;}const j=e.target.closest('[data-jump]');if(j){document.getElementById(j.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'});return;}const p=e.target.closest('[data-photo]');if(p){document.getElementById('largePhoto').src=p.dataset.photo;document.getElementById('largePhoto').alt=p.dataset.caption;document.getElementById('photoCaption').textContent=p.dataset.caption;document.getElementById('photoSource').href=p.dataset.source;document.getElementById('photoViewer').showModal();}});
    document.getElementById('areaFilter').onchange=e=>{area=e.target.value;renderBoard();};document.getElementById('sortBy').onchange=e=>{sortBy=e.target.value;renderBoard();};document.getElementById('onlyFavorites').onclick=function(){onlyFavorites=!onlyFavorites;this.setAttribute('aria-pressed',String(onlyFavorites));renderBoard();};document.getElementById('closeRoute').onclick=closeRoute;document.getElementById('closePhoto').onclick=()=>document.getElementById('photoViewer').close();document.getElementById('routeModal').addEventListener('close',()=>{if(!document.getElementById('routeModal').open)document.documentElement.style.overflow='';});for(const id of ['routeModal','photoViewer'])document.getElementById(id).addEventListener('click',e=>{if(e.target===e.currentTarget){if(id==='routeModal')closeRoute();else e.currentTarget.close();}});document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const p=document.getElementById('photoViewer');if(p.open){e.preventDefault();p.close();}else if(document.getElementById('routeModal').open){e.preventDefault();closeRoute();}});document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const next=activeTab==='routes'?'stays':'routes';switchTab(next);document.getElementById('tab-'+next).focus();});window.addEventListener('hashchange',handleHash);renderBoard();renderStays();handleHash();

</script>
</body>
</html>
